<div class="p-6">
    <h1 class="text-2xl font-semibold mb-6">Your Boards</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        <mat-card
            *ngFor="let board of boards()"
            class="cursor-pointer hover:shadow-lg transition-shadow"
            (click)="openBoard(board)"
        >
            <mat-card-title class="text-lg font-medium">
                {{ board.title }}
            </mat-card-title>

            <mat-card-subtitle class="text-sm text-gray-500">
                {{ board.description || 'No description' }}
            </mat-card-subtitle>
        </mat-card>

        <!-- Add new board (coming soon) -->
        <mat-card class="flex items-center justify-center cursor-pointer" (click)="openBoard({ id: 'new', title: '', lists: [], members: [] })">
            <span class="text-blue-600 font-medium">+ Create New Board</span>
        </mat-card>
    </div>
</div>
